[package]
name = "bevy_stdb"
version = "0.8.0"
edition = "2024"
rust-version = "1.93"
description = "A Bevy-native integration for SpacetimeDB with table messages, subscriptions, and reconnect support."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/onx2/bevy_stdb"
homepage = "https://github.com/onx2/bevy_stdb"
documentation = "https://docs.rs/bevy_stdb"
keywords = ["bevy", "spacetimedb", "spacetime", "database", "multiplayer", "ecs"]
categories = ["game-development", "network-programming", "database"]
exclude = [
    ".github/",
]

[dependencies]
bevy_app = "0.18"
bevy_ecs = "0.18"
bevy_time = "0.18"
bevy_tasks = "0.18"
crossbeam-channel = "0.5"

serde = { version = "1.0", optional = true, features = ["derive"] }
serde_json = { version = "1.0", optional = true }
url = { version = "2.5", optional = true }
oauth2 = { version = "5.0", optional = true, default-features = false }

[features]
default = []

browser = [
    "spacetimedb-sdk/browser",
    "dep:js-sys",
    "dep:web-sys",
]

auth-oidc = [
    "dep:url",
    "dep:serde",
    "dep:reqwest",
    "dep:web-sys",
    "dep:oauth2",
    "dep:keyring",
    "dep:webbrowser",
]
auth-steam = [
    "dep:url",
    "dep:serde",
    "dep:serde_json",
    "dep:reqwest",
    "dep:hex",
    "dep:steamworks"
]

# -----------------------------------------------------------------------------
# Native-specific target crates
# -----------------------------------------------------------------------------
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
reqwest = { version = "0.13", optional = true, features = ["blocking", "json", "form"] }
keyring = { version = "3.6", optional = true }
webbrowser = { version = "1", optional = true }
steamworks = { version = "0.13", optional = true }
hex = { version = "0.4", optional = true }

# -----------------------------------------------------------------------------
# Wasm32-specific (Browser) target crates
# -----------------------------------------------------------------------------
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
reqwest = { version = "0.13", optional = true, features = ["json", "form"] }
js-sys = { version = "0.3", optional = true, default-features = false }
web-sys = { version = "0.3", optional = true, default-features = false, features = [
    "Window",
    "Location",
    "History",
    "Storage",
] }


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
